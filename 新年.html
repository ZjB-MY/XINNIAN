<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>2026跨年快乐放烟花网页</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <meta name="msapplication-TileColor" content="#000000">
    <style type="text/css">
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            touch-action: none;
            font-family: "STXingkai", "SimHei", "Microsoft Yahei", sans-serif;
        }
        /* 初始点击按钮样式 */
        #yhBtn {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 30px;
            background: #000;
            cursor: pointer;
        }
        #yhBtn .icon {
            font-size: 80px;
            margin-bottom: 30px;
        }
        /* 大号数字倒计时样式（5→1）+ 新年快乐一行显示 */
        .num-countdown {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12rem; /* 缩小字号避免换行 */
            color: #fff;
            text-shadow: 0 0 20px #ff0066, 0 0 40px #ff0066, 0 0 60px #ff0066;
            z-index: 20;
            display: none;
            white-space: nowrap; /* 强制文字不换行 */
            text-align: center;
            width: 100%; /* 占满宽度确保居中 */
        }
        /* 实时倒计时文字容器 - 5→1结束后才显示 */
        .countdown-panel {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            z-index: 10;
            color: #fff;
            text-align: center;
            padding: 0 20px;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .countdown-panel.show {
            opacity: 1;
        }
        .countdown-panel h2 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #fff;
        }
        .countdown-panel .year {
            font-size: 3rem;
            color: #ff4d94;
            text-shadow: 0 0 15px #ff4d94;
            margin-bottom: 15px;
        }
        .countdown-panel .time-text {
            font-size: 1.2rem;
            margin-bottom: 8px;
        }
        .countdown-panel .time-num {
            font-size: 1.5rem;
            color: #ff4d94;
            text-shadow: 0 0 15px #ff4d94;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .countdown-panel .blessing {
            font-size: 1.2rem;
            text-shadow: 0 0 10px #fff;
            margin-bottom: 8px;
        }
        .countdown-panel .tip {
            font-size: 1rem;
            color: #ccc;
            margin-bottom: 5px;
        }
        .countdown-panel .copyright {
            font-size: 1rem;
            color: #999;
        }
        /* 画布容器 */
        .canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #trails-canvas {
            z-index: 1;
        }
        #main-canvas {
            z-index: 2;
        }
    </style>
</head>
<body>
    <div id="yhBtn">
        <div class="icon">💥</div>
        <div>点击放烟花</div>
    </div>

    <div class="num-countdown" id="numCountdown">5</div>

    <!-- 单一实时倒计时面板，避免重复 -->
    <div class="countdown-panel" id="countdownPanel">
        <h2>倒计时</h2>
        <div class="year">2026</div>
        <div class="time-text">还有</div>
        <div class="time-num" id="time">计算中...</div>
        <div class="blessing" id="text1">提前祝你2026新年快乐</div>
        <div class="tip">彩蛋:点击屏幕任意地方即可放烟花</div>
        <div class="copyright">2026跨年快乐</div>
    </div>

    <div class="canvas-container">
        <canvas id="trails-canvas"></canvas>
        <canvas id="main-canvas"></canvas>
    </div>

    <script>
        var canvas, ctx, trailsCanvas, trailsCtx;
        var fireworks = [];
        var particles = [];
        var mouseDown = false;
        var mouseX, mouseY;

        // 初始化画布
        function initCanvas() {
            canvas = document.getElementById('main-canvas');
            trailsCanvas = document.getElementById('trails-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            trailsCanvas.width = window.innerWidth;
            trailsCanvas.height = window.innerHeight;
            
            ctx = canvas.getContext('2d');
            trailsCtx = trailsCanvas.getContext('2d');
            trailsCtx.fillStyle = 'rgba(0, 0, 0, 0.1)';

            // 窗口大小适配
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                trailsCanvas.width = window.innerWidth;
                trailsCanvas.height = window.innerHeight;
                trailsCtx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            });

            // 鼠标/触摸放烟花事件
            document.addEventListener('mousedown', (e) => {
                mouseDown = true;
                launchFirework(e.clientX, e.clientY);
            });
            document.addEventListener('mouseup', () => mouseDown = false);
            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                if (mouseDown) launchFirework(mouseX, mouseY);
            });
            document.addEventListener('touchstart', (e) => {
                e.preventDefault();
                mouseDown = true;
                const touch = e.touches[0];
                launchFirework(touch.clientX, touch.clientY);
            });
            document.addEventListener('touchend', () => mouseDown = false);
            document.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                mouseX = touch.clientX;
                mouseY = touch.clientY;
                if (mouseDown) launchFirework(mouseX, mouseY);
            });
        }

        // 烟花类
        class Firework {
            constructor(x, y) {
                this.x = x;
                this.y = canvas.height;
                this.targetX = x;
                this.targetY = y;
                this.speed = 3;
                this.acceleration = 0.08;
                this.alpha = 1;
                this.hue = Math.floor(Math.random() * 360);
            }
            update() {
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const velocityX = (dx / distance) * this.speed;
                const velocityY = (dy / distance) * this.speed;
                this.speed += this.acceleration;
                
                this.x += velocityX;
                this.y += velocityY;
                
                if (distance < 15) {
                    this.explode();
                    return true;
                }
                return false;
            }
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, canvas.height);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsla(${this.hue}, 100%, 50%, 0.8)`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            explode() {
                const particleCount = Math.floor(Math.random() * 100) + 150;
                // 烟花爆炸位置避开文字区域，防止遮挡
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle(this.x, this.y, this.hue));
                }
            }
        }

        // 粒子类
        class Particle {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 3;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.gravity = 0.06;
                this.friction = 0.97;
                this.hue = hue;
                this.alpha = 1;
                this.decay = Math.random() * 0.012 + 0.008;
                this.size = Math.random() * 2.5 + 1.5;
            }
            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                
                this.alpha -= this.decay;
                return this.alpha <= 0;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, ${this.alpha})`;
                ctx.fill();
            }
        }

        // 发射烟花
        function launchFirework(x, y) {
            fireworks.push(new Firework(x, y));
        }

        // 烟花动画循环
        function animate() {
            trailsCtx.fillRect(0, 0, trailsCanvas.width, trailsCanvas.height);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 更新烟花
            for (let i = fireworks.length - 1; i >= 0; i--) {
                const firework = fireworks[i];
                if (firework.update()) {
                    fireworks.splice(i, 1);
                } else {
                    firework.draw();
                }
            }
            
            // 更新粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                if (particle.update()) {
                    particles.splice(i, 1);
                } else {
                    particle.draw();
                }
            }
            
            requestAnimationFrame(animate);
        }

        // 大号数字倒计时（5→1→新年快乐）
        function startNumCountdown() {
            const numEl = document.getElementById('numCountdown');
            let count = 5;
            numEl.style.display = 'block';
            numEl.textContent = count;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    numEl.textContent = count;
                    // 数字变化时在屏幕中央放烟花（位置上移避免遮挡文字）
                    launchFirework(canvas.width/2, canvas.height/3);
                } else if (count === 0) {
                    numEl.textContent = '新年快乐'; // 一行显示
                    // 全屏烟花特效（避开文字区域）
                    for(let i=0; i<25; i++){
                        const x = Math.random()*(canvas.width-100) + 50;
                        const y = Math.random()*(canvas.height/2) + 50;
                        launchFirework(x, y);
                    }
                } else {
                    clearInterval(timer);
                    // 数字倒计时结束后隐藏，同时显示实时倒计时面板
                    setTimeout(() => {
                        numEl.style.display = 'none';
                        showRealTimeCountdown(); // 显示实时倒计时
                    }, 1000);
                }
            }, 1000);
        }

        // 显示实时倒计时并启动更新
        function showRealTimeCountdown() {
            const panel = document.getElementById('countdownPanel');
            panel.classList.add('show');
            updateRealTimeCountdown(); // 启动实时时间计算
        }

        // 实时计算距离2026年元旦的时间
        function updateRealTimeCountdown() {
            // 目标时间：2026年1月1日 00:00:00
            const targetTime = new Date('2026-01-01T00:00:00').getTime();
            const nowTime = new Date().getTime();
            const diffTime = targetTime - nowTime;

            if (diffTime <= 0) {
                document.getElementById('time').textContent = '0天00小时00分钟00秒';
                document.getElementById('text1').textContent = '2026新年快乐！🎉';
                return;
            }

            // 计算天、时、分、秒（补零优化）
            const days = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diffTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
            const minutes = Math.floor((diffTime % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            const seconds = Math.floor((diffTime % (1000 * 60)) / 1000).toString().padStart(2, '0');

            // 更新页面
            document.getElementById('time').textContent = `${days}天${hours}小时${minutes}分钟${seconds}秒`;
            
            // 每秒更新一次
            setTimeout(updateRealTimeCountdown, 1000);
        }

        // 页面初始化
        window.onload = function() {
            initCanvas();
            
            // 点击初始按钮触发所有效果
            document.getElementById('yhBtn').addEventListener('click', function() {
                this.style.display = 'none';
                startNumCountdown(); // 启动5→1数字倒计时
                animate(); // 启动烟花动画
                
                // 自动放烟花（增强氛围）
                setInterval(() => {
                    if (Math.random() > 0.6) {
                        const x = Math.random()*(canvas.width-100) + 50;
                        const y = Math.random()*(canvas.height/2) + 50;
                        launchFirework(x, y);
                    }
                }, 1500);
            });
        };
    </script>
</body>
</html>
